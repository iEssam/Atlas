[package]
name = "atlas-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The binary is `atlas` (the scriptable CLI), not `atlas-cli`.
[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
# Read-only contract client + named-pipe transport. atlas-cli builds the
# AtlasQuery client for every query and the AtlasRules client ONLY to call the
# read-only ListRules RPC — it never invokes a mutating RPC on either service.
atlas-ipc = { path = "../atlas-ipc", version = "=0.3.0" }
anyhow = { workspace = true }
clap = { workspace = true }
# JSON output is built by hand over serde_json (prost types aren't Serialize),
# mirroring atlas-mcp. No new workspace dependencies are introduced.
serde_json = { workspace = true }
# tokio runtime + tonic drive the RPCs over the pipe channel.
tokio = { workspace = true }
tonic = { workspace = true }
