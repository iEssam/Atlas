// System Atlas IPC contract (tech-stack.md §5).
// Contract sketch — compiled into the service and UI clients at milestone M4.
// Rules: additive-only changes within a major version; buf lint/breaking in CI.

syntax = "proto3";

package atlas.v0;

message CapabilitiesRequest {}

message CapabilitiesReply {
  string service_version = 1;
  // Degraded-mode propagation: UIs render only what the service can provide,
  // e.g. "gpu_vendor_telemetry", "driver_sensors", "etw_process_events".
  repeated string capability_flags = 2;
}

message ProcessRow {
  uint32 pid = 1;
  uint32 parent_pid = 2;
  string image_name = 3;
  uint32 session_id = 4;
  // FILETIME units (100 ns since 1601-01-01); part of process identity.
  int64 create_time_100ns = 5;
  // Share of total CPU capacity, 0..=1000.
  uint32 cpu_permille = 6;
  uint64 working_set = 7;
  uint64 private_bytes = 8;
  uint64 read_bps = 9;
  uint64 write_bps = 10;
  uint32 handle_count = 11;
  uint32 thread_count = 12;
  // Application grouping (PRD §9.2.1): processes sharing an application
  // identity carry the same non-empty group key (heuristic: image family +
  // parent chain). Empty = ungrouped.
  string app_group = 13;
  ProcessRole role = 14;
  // GPU usage is the busiest engine for this process, not a sum of engines.
  uint32 gpu_permille = 15;
  uint64 gpu_dedicated_bytes = 16;
  uint64 gpu_shared_bytes = 17;
}

enum ProcessRole {
  PROCESS_ROLE_UNSPECIFIED = 0;
  // The root of its application group (its parent is outside the group).
  PROCESS_ROLE_MAIN = 1;
  // Same-group descendant of the main process (helper/renderer/worker —
  // finer roles need command lines, which the collector doesn't have yet).
  PROCESS_ROLE_HELPER = 2;
  PROCESS_ROLE_SERVICE = 3;
}

message SystemGauges {
  int64 ts_ms = 1;
  uint32 cpu_permille = 2;
  uint64 mem_used = 3;
  uint64 mem_total = 4;
  uint64 commit_used = 5;
  uint64 commit_limit = 6;
  uint32 process_count = 7;
  uint32 thread_count = 8;
  uint32 handle_count = 9;
  uint32 gpu_permille = 10;
  uint64 gpu_dedicated_used = 11;
  uint64 gpu_dedicated_budget = 12;
  uint64 gpu_shared_used = 13;
  uint64 gpu_shared_budget = 14;
}

enum GpuEngineClass {
  GPU_ENGINE_OTHER = 0;
  GPU_ENGINE_3D = 1;
  GPU_ENGINE_COMPUTE = 2;
  GPU_ENGINE_COPY = 3;
  GPU_ENGINE_VIDEO_ENCODE = 4;
  GPU_ENGINE_VIDEO_DECODE = 5;
}

message GpuEngineTelemetry {
  GpuEngineClass engine_class = 1;
  uint32 utilization_permille = 2;
}

enum GpuTelemetrySource {
  GPU_SOURCE_UNSPECIFIED = 0;
  GPU_SOURCE_WINDOWS_WDDM = 1;
  GPU_SOURCE_NVIDIA_NVML = 2;
}

enum GpuSensorKind {
  GPU_SENSOR_UNSPECIFIED = 0;
  GPU_SENSOR_CORE_TEMPERATURE = 1;
  GPU_SENSOR_MEMORY_TEMPERATURE = 2;
  GPU_SENSOR_HOTSPOT_TEMPERATURE = 3;
  GPU_SENSOR_BOARD_TEMPERATURE = 4;
  GPU_SENSOR_POWER_WATTS = 5;
  GPU_SENSOR_POWER_PERCENT = 6;
  GPU_SENSOR_CORE_CLOCK = 7;
  GPU_SENSOR_MEMORY_CLOCK = 8;
  GPU_SENSOR_FAN_RPM = 9;
  GPU_SENSOR_FAN_PERCENT = 10;
  GPU_SENSOR_THROTTLE_REASONS = 11;
}

enum GpuAvailabilityReason {
  GPU_AVAILABILITY_NONE = 0;
  GPU_AVAILABILITY_PROVIDER_MISSING = 1;
  GPU_AVAILABILITY_HELPER_START_FAILURE = 2;
  GPU_AVAILABILITY_HELPER_TIMEOUT = 3;
  GPU_AVAILABILITY_HELPER_BACKOFF = 4;
  GPU_AVAILABILITY_STALE_SAMPLE = 5;
  GPU_AVAILABILITY_UNSUPPORTED_METRIC = 6;
  GPU_AVAILABILITY_IDENTITY_UNMATCHED = 7;
  GPU_AVAILABILITY_DEVICE_LOST = 8;
  GPU_AVAILABILITY_DRIVER_ERROR = 9;
}

enum GpuTemperatureKind {
  GPU_TEMPERATURE_CORE = 0;
  GPU_TEMPERATURE_MEMORY = 1;
  GPU_TEMPERATURE_HOTSPOT = 2;
  GPU_TEMPERATURE_BOARD = 3;
  GPU_TEMPERATURE_OTHER = 4;
}

enum GpuThrottleReason {
  GPU_THROTTLE_UNSPECIFIED = 0;
  GPU_THROTTLE_SOFTWARE_THERMAL = 1;
  GPU_THROTTLE_HARDWARE_THERMAL = 2;
  GPU_THROTTLE_SOFTWARE_POWER_CAP = 3;
  GPU_THROTTLE_HARDWARE_SLOWDOWN = 4;
  GPU_THROTTLE_HARDWARE_POWER_BRAKE = 5;
  GPU_THROTTLE_OTHER = 6;
  GPU_THROTTLE_IDLE = 7;
  GPU_THROTTLE_APPLICATION_CLOCKS = 8;
  GPU_THROTTLE_SYNC_BOOST = 9;
  GPU_THROTTLE_DISPLAY_CLOCK_SETTING = 10;
}

message GpuTemperatureTelemetry {
  GpuTemperatureKind kind = 1;
  double celsius = 2;
  GpuTelemetrySource source = 3;
  string label = 4;
}

message GpuSensorAvailability {
  GpuSensorKind kind = 1;
  bool available = 2;
  GpuTelemetrySource source = 3;
  GpuAvailabilityReason reason = 4;
  string detail = 5;
}

message GpuAdapterTelemetry {
  string adapter_key = 1;
  string name = 2;
  string driver_version = 3;
  bool active_display = 4;
  uint32 utilization_permille = 5;
  uint64 dedicated_used = 6;
  uint64 dedicated_budget = 7;
  uint64 shared_used = 8;
  uint64 shared_budget = 9;
  repeated GpuEngineTelemetry engines = 10;
  optional double temperature_c = 11;
  optional double power_w = 12;
  optional uint32 core_clock_mhz = 13;
  optional uint32 memory_clock_mhz = 14;
  optional uint32 fan_rpm = 15;
  optional bool thermal_throttling = 16;
  string sensor_source = 17;
  string sensor_unavailable_reason = 18;
  uint32 vendor_id = 19;
  uint32 device_id = 20;
  uint32 physical_adapter_index = 21;
  uint32 pci_domain = 22;
  uint32 pci_bus = 23;
  uint32 pci_device = 24;
  uint32 pci_function = 25;
  string driver_date = 26;
  optional double power_percent = 27;
  optional double fan_percent = 28;
  optional double temperature_warning_c = 29;
  optional double temperature_max_c = 30;
  repeated GpuTemperatureTelemetry temperatures = 31;
  repeated GpuThrottleReason throttle_reasons = 32;
  repeated GpuSensorAvailability sensor_availability = 33;
  bool pci_identity_available = 34;
}

message SnapshotRequest {
  // 0 = all processes.
  uint32 top_n = 1;
}

message SnapshotReply {
  SystemGauges system = 1;
  repeated ProcessRow processes = 2;
  repeated GpuAdapterTelemetry gpu_adapters = 3;
  string gpu_unavailable_reason = 4;
}

// ---------------------------------------------------------------------------
// M6: historical queries, search, bookmarks (read-only surface).
// ---------------------------------------------------------------------------

message TimeRange {
  int64 from_ms = 1;
  // Exclusive upper bound.
  int64 to_ms = 2;
}

// Mirrors the service-internal metric catalogue; the server maps these to its
// storage ids. Per-process metrics require scope != 0 (a process instance row
// id); Sys* metrics use scope 0.
enum MetricKind {
  METRIC_KIND_UNSPECIFIED = 0;
  CPU_PERMILLE = 1;
  WORKING_SET = 2;
  PRIVATE_BYTES = 3;
  READ_BPS = 4;
  WRITE_BPS = 5;
  GPU_PERMILLE = 6;
  GPU_DEDICATED_BYTES = 7;
  GPU_SHARED_BYTES = 8;
  SYS_CPU_PERMILLE = 20;
  SYS_MEM_USED = 21;
  SYS_COMMIT_USED = 22;
  SYS_PROCESS_COUNT = 23;
  SYS_GPU_PERMILLE = 24;
  SYS_GPU_DEDICATED_USED = 25;
  SYS_GPU_SHARED_USED = 26;
  SYS_GPU_MEMORY_USED = 27;
  SYS_GPU_MEMORY_BUDGET = 28;
  GPU_ADAPTER_PERMILLE = 40;
  GPU_ADAPTER_DEDICATED_USED = 41;
  GPU_ADAPTER_SHARED_USED = 42;
  GPU_ADAPTER_TEMPERATURE_C = 43;
  GPU_ADAPTER_POWER_W = 44;
  GPU_ADAPTER_CORE_CLOCK_MHZ = 45;
  GPU_ADAPTER_MEMORY_CLOCK_MHZ = 46;
  GPU_ADAPTER_FAN_RPM = 47;
  GPU_ADAPTER_THROTTLING = 48;
  GPU_ADAPTER_POWER_PERCENT = 49;
  GPU_ADAPTER_FAN_PERCENT = 50;
  GPU_ADAPTER_MEMORY_TEMPERATURE_C = 51;
  GPU_ADAPTER_HOTSPOT_TEMPERATURE_C = 52;
}

message QueryRangeRequest {
  MetricKind metric = 1;
  // Process instance row id; 0 for system-scope metrics.
  int64 scope = 2;
  TimeRange range = 3;
  // Server-side decimation target: never returns more buckets than this
  // (UI passes ~pixel width, PRD §11.3). 0 = server default (500).
  uint32 buckets = 4;
}

message RangeBucket {
  int64 start_ms = 1;
  double min = 2;
  double max = 3;
  double avg = 4;
  uint32 samples = 5;
}

message QueryRangeReply {
  // Empty buckets are omitted — gaps render as missing data, never zero
  // (PRD §11.3).
  repeated RangeBucket buckets = 1;
}

message ListEventsRequest {
  TimeRange range = 1;
  // proc_event kinds to include (0=start, 1=stop); empty = all.
  repeated uint32 kinds = 2;
  uint32 limit = 3;
}

message EventRow {
  int64 ts_ms = 1;
  uint32 kind = 2;
  uint32 pid = 3;
  uint32 parent_pid = 4;
  uint32 session_id = 5;
  string image_name = 6;
  // Only meaningful when has_exit_status is true (kind=stop).
  int32 exit_status = 7;
  bool has_exit_status = 8;
}

message ListEventsReply {
  repeated EventRow events = 1;
  bool truncated = 2;
}

message SearchRequest {
  string query = 1;
  uint32 limit = 2;
}

message ProcessHit {
  int64 proc_row_id = 1;
  uint32 pid = 2;
  string image_name = 3;
  int64 first_seen_ms = 4;
  // 0 when still live.
  int64 exit_seen_ms = 5;
  bool live = 6;
}

message SearchHit {
  oneof entity {
    ProcessHit process = 1;
    EventRow event = 2;
    Bookmark bookmark = 3;
  }
}

message SearchReply {
  repeated SearchHit hits = 1;
}

message CreateBookmarkRequest {
  int64 ts_ms = 1;
  string label = 2;
}

message CreateBookmarkReply {
  int64 id = 1;
}

message ListBookmarksRequest {
  TimeRange range = 1;
}

message Bookmark {
  int64 id = 1;
  int64 ts_ms = 2;
  string label = 3;
  int64 created_ms = 4;
}

message ListBookmarksReply {
  repeated Bookmark bookmarks = 1;
}

// A persisted comparison definition. The named change is context supplied by
// the user; Atlas reports correlation only and never claims the change caused
// the measured result.
message Experiment {
  int64 id = 1;
  string name = 2;
  string change_description = 3;
  MetricKind metric = 4;
  double threshold = 5;
  TimeRange baseline = 6;
  TimeRange followup = 7;
  int64 created_ms = 8;
}

message CreateExperimentRequest { Experiment experiment = 1; }
message CreateExperimentReply { Experiment experiment = 1; }
message ListExperimentsRequest { uint32 limit = 1; }
message ListExperimentsReply { repeated Experiment experiments = 1; }
message CompareExperimentRequest { int64 id = 1; }

message ExperimentPeriodSummary {
  double average = 1;
  double peak = 2;
  uint64 duration_above_threshold_ms = 3;
  uint64 samples = 4;
  uint32 populated_buckets = 5;
  uint32 crashes = 6;
  uint32 system_changes = 7;
}

enum ExperimentVerdict {
  EXPERIMENT_VERDICT_UNSPECIFIED = 0;
  EXPERIMENT_INSUFFICIENT_DATA = 1;
  EXPERIMENT_IMPROVED = 2;
  EXPERIMENT_REGRESSED = 3;
  EXPERIMENT_NO_CLEAR_CHANGE = 4;
}

message CompareExperimentReply {
  Experiment experiment = 1;
  ExperimentVerdict verdict = 2;
  string summary = 3;
  ExperimentPeriodSummary baseline = 4;
  ExperimentPeriodSummary followup = 5;
  double average_delta_percent = 6;
  repeated string new_processes = 7;
  repeated string removed_processes = 8;
  bool incomplete = 9;
  string data_quality = 10;
  string caveat = 11;
}

// ---------------------------------------------------------------------------
// M7: privacy activity, startup inventory, services (read-only surface).
// ---------------------------------------------------------------------------

// Privacy-sensitive capabilities tracked via the Windows CapabilityAccessManager
// ConsentStore (PRD §9.10). "where Windows exposes it" — the service labels
// unavailable capabilities via capability_flags rather than faking data.
enum CapabilityKind {
  CAPABILITY_KIND_UNSPECIFIED = 0;
  CAMERA = 1;
  MICROPHONE = 2;
  LOCATION = 3;
}

// Current per-(app, capability) usage from the ConsentStore. in_use is true
// when a start has no matching stop (LastUsedTimeStop == 0).
message PrivacyUsage {
  CapabilityKind capability = 1;
  // ConsentStore key (packaged app id or the moniker for a desktop app).
  string app_id = 2;
  string display_name = 3;
  bool packaged = 4;
  int64 last_start_ms = 5;
  // 0 when currently in use.
  int64 last_stop_ms = 6;
  bool in_use = 7;
}

message ListPrivacyUsageRequest {
  // Empty = all capabilities.
  repeated CapabilityKind capabilities = 1;
}

message ListPrivacyUsageReply {
  repeated PrivacyUsage usages = 1;
}

// Recorded usage transitions (start/stop), from the service's watched history.
message PrivacyEvent {
  int64 ts_ms = 1;
  CapabilityKind capability = 2;
  string app_id = 3;
  string display_name = 4;
  // true = start, false = stop.
  bool started = 5;
}

message ListPrivacyEventsRequest {
  TimeRange range = 1;
  uint32 limit = 2;
}

message ListPrivacyEventsReply {
  repeated PrivacyEvent events = 1;
  bool truncated = 2;
}

enum StartupSource {
  STARTUP_SOURCE_UNSPECIFIED = 0;
  RUN_KEY_MACHINE = 1;
  RUN_KEY_USER = 2;
  STARTUP_FOLDER_MACHINE = 3;
  STARTUP_FOLDER_USER = 4;
  SCHEDULED_TASK = 5;
  SERVICE = 6;
  PACKAGED_TASK = 7;
}

message StartupEntry {
  string name = 1;
  StartupSource source = 2;
  string command = 3;
  string publisher = 4;
  // StartupApproved / task / service enabled state where determinable.
  bool enabled = 5;
  // "machine" or "user".
  string scope = 6;
}

message ListStartupRequest {}

message ListStartupReply {
  repeated StartupEntry entries = 1;
}

enum ServiceState {
  SERVICE_STATE_UNSPECIFIED = 0;
  SERVICE_STOPPED = 1;
  SERVICE_START_PENDING = 2;
  SERVICE_STOP_PENDING = 3;
  SERVICE_RUNNING = 4;
  SERVICE_CONTINUE_PENDING = 5;
  SERVICE_PAUSE_PENDING = 6;
  SERVICE_PAUSED = 7;
}

enum ServiceStartType {
  SERVICE_START_TYPE_UNSPECIFIED = 0;
  START_BOOT = 1;
  START_SYSTEM = 2;
  START_AUTO = 3;
  START_MANUAL = 4;
  START_DISABLED = 5;
}

message ServiceEntry {
  string name = 1;
  string display_name = 2;
  string description = 3;
  ServiceState state = 4;
  ServiceStartType start_type = 5;
  // 0 when not running.
  uint32 pid = 6;
  string account = 7;
  string binary_path = 8;
  bool delayed_auto_start = 9;
}

message ListServicesRequest {
  // Case-insensitive substring over name/display_name; empty = all.
  string filter = 1;
}

message ListServicesReply {
  repeated ServiceEntry services = 1;
}

// ---------------------------------------------------------------------------
// M8: incident detection, diagnostics, reports (PRD §9.3.7, §9.15, §9.18).
// All read-only: diagnosis explains recorded data, it never mutates the system.
// ---------------------------------------------------------------------------

enum IncidentKind {
  INCIDENT_KIND_UNSPECIFIED = 0;
  CPU_SATURATION = 1;
  MEMORY_PRESSURE = 2;
  DISK_LATENCY = 3;
  GPU_SATURATION = 4;
  GPU_MEMORY_EXHAUSTION = 5;
  GPU_THERMAL_THROTTLING = 6;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_CRITICAL = 3;
}

message Incident {
  int64 id = 1;
  IncidentKind kind = 2;
  int64 start_ms = 3;
  // 0 = still ongoing.
  int64 end_ms = 4;
  Severity severity = 5;
  // Peak of the driving metric during the window (e.g. permille or ms).
  double peak_value = 6;
  // Plain-language one-liner (PRD §3.2 — no vague "needs attention").
  string summary = 7;
}

message ListIncidentsRequest {
  TimeRange range = 1;
  uint32 limit = 2;
}

message ListIncidentsReply {
  repeated Incident incidents = 1;
  bool truncated = 2;
}

// The PRD's fixed confidence ladder (§9.15.2). Temporal overlap alone caps at
// LOW; strong attribution over most of the window reaches HIGH; CONFIRMED is
// reserved for measured facts (e.g. a recorded crash).
enum Confidence {
  CONFIDENCE_UNSPECIFIED = 0;
  INSUFFICIENT = 1;
  LOW = 2;
  MEDIUM = 3;
  HIGH = 4;
  CONFIRMED = 5;
}

// A measured fact backing the diagnosis — never an inference.
message EvidenceItem {
  string text = 1;
  // 0 when the fact is range-wide rather than a point.
  int64 ts_ms = 2;
  string metric = 3;
  double value = 4;
}

message ContributingFactor {
  string description = 1;
  Confidence confidence = 2;
  // 0 when not process-specific.
  uint32 pid = 3;
  string image_name = 4;
  // Share of the saturated resource attributed to this factor, 0..=1.
  double attribution = 5;
}

message Diagnosis {
  // Plain-language statement of what happened.
  string observed = 1;
  TimeRange range = 2;
  repeated EvidenceItem evidence = 3;
  // Ranked most-likely first.
  repeated ContributingFactor factors = 4;
  Confidence overall_confidence = 5;
  // Competing possibilities surfaced when the top factors are close.
  repeated string alternatives = 6;
  string recommendation = 7;
  string risk = 8;
  string reversibility = 9;
  string verification_plan = 10;
}

message DiagnoseRequest {
  // Diagnose a detected incident by id; 0 = use the ad-hoc range instead.
  int64 incident_id = 1;
  TimeRange range = 2;
}

message DiagnoseReply {
  bool available = 1;
  // "insufficient evidence" / "outside retention" / "monitoring was off"
  // (PRD §9.16.4 — the engine states its limits).
  string unavailable_reason = 2;
  Diagnosis diagnosis = 3;
}

// ---------------------------------------------------------------------------
// Evidence-backed insights. These are deterministic interpretations assembled
// from measured snapshots and recorded incidents. They never execute actions;
// destinations only deep-link the first-party UI into an existing safe flow.
// ---------------------------------------------------------------------------

enum InsightKind {
  INSIGHT_KIND_UNSPECIFIED = 0;
  INSIGHT_KIND_CPU_PRESSURE = 1;
  INSIGHT_KIND_MEMORY_PRESSURE = 2;
  INSIGHT_KIND_GPU_MEMORY_PRESSURE = 3;
  INSIGHT_KIND_GPU_THERMAL_LIMIT = 4;
  INSIGHT_KIND_RESOURCE_STATE_CLEAR = 5;
}

enum InsightStatus {
  INSIGHT_STATUS_UNSPECIFIED = 0;
  INSIGHT_STATUS_EMERGING = 1;
  INSIGHT_STATUS_ACTIVE = 2;
  INSIGHT_STATUS_RESOLVED = 3;
  INSIGHT_STATUS_CLEAR = 4;
  INSIGHT_STATUS_LIMITED = 5;
}

message InsightRecommendation {
  string text = 1;
  string risk = 2;
  string reversibility = 3;
  string verification_plan = 4;
  // First-party route hint such as "process:4242:1337000" or "graphics".
  // It is descriptive only and never authorizes a mutation.
  string destination = 5;
}

message Insight {
  // Stable deduplication identity derived from kind + affected entity.
  string fingerprint = 1;
  InsightKind kind = 2;
  InsightStatus status = 3;
  Severity severity = 4;
  Confidence confidence = 5;
  string title = 6;
  string observation = 7;
  string significance = 8;
  TimeRange range = 9;
  repeated EvidenceItem evidence = 10;
  repeated ContributingFactor factors = 11;
  repeated string alternatives = 12;
  repeated string limitations = 13;
  InsightRecommendation recommendation = 14;
  int64 updated_ms = 15;
}

message ListInsightsRequest {
  bool active_only = 1;
  // 0 = service default (10).
  uint32 limit = 2;
}

message ListInsightsReply {
  repeated Insight insights = 1;
  bool truncated = 2;
  // Human-readable scope of the currently implemented playbooks.
  string coverage_summary = 3;
}

enum ReportFormat {
  REPORT_FORMAT_UNSPECIFIED = 0;
  REPORT_HTML = 1;
  REPORT_CSV = 2;
  REPORT_JSON = 3;
  REPORT_TEXT = 4;
}

message RedactionOptions {
  bool redact_user_names = 1;
  bool redact_computer_name = 2;
  bool redact_paths = 3;
  bool redact_command_lines = 4;
}

message GenerateReportRequest {
  // Report on a detected incident by id; 0 = use the ad-hoc range.
  int64 incident_id = 1;
  TimeRange range = 2;
  ReportFormat format = 3;
  RedactionOptions redaction = 4;
}

message GenerateReportReply {
  string content = 1;
  string content_type = 2;
}

service AtlasQuery {
  rpc GetCapabilities(CapabilitiesRequest) returns (CapabilitiesReply);
  rpc GetSnapshot(SnapshotRequest) returns (SnapshotReply);
  rpc StreamSnapshots(SnapshotRequest) returns (stream SnapshotReply);
  rpc QueryRange(QueryRangeRequest) returns (QueryRangeReply);
  rpc ListEvents(ListEventsRequest) returns (ListEventsReply);
  rpc Search(SearchRequest) returns (SearchReply);
  rpc CreateBookmark(CreateBookmarkRequest) returns (CreateBookmarkReply);
  rpc ListBookmarks(ListBookmarksRequest) returns (ListBookmarksReply);
  rpc CreateExperiment(CreateExperimentRequest) returns (CreateExperimentReply);
  rpc ListExperiments(ListExperimentsRequest) returns (ListExperimentsReply);
  rpc CompareExperiment(CompareExperimentRequest) returns (CompareExperimentReply);
  rpc ListPrivacyUsage(ListPrivacyUsageRequest) returns (ListPrivacyUsageReply);
  rpc ListPrivacyEvents(ListPrivacyEventsRequest) returns (ListPrivacyEventsReply);
  rpc ListStartup(ListStartupRequest) returns (ListStartupReply);
  rpc ListServices(ListServicesRequest) returns (ListServicesReply);
  rpc ListIncidents(ListIncidentsRequest) returns (ListIncidentsReply);
  rpc Diagnose(DiagnoseRequest) returns (DiagnoseReply);
  rpc ListInsights(ListInsightsRequest) returns (ListInsightsReply);
  rpc GenerateReport(GenerateReportRequest) returns (GenerateReportReply);
  rpc GetProcessDetail(ProcessDetailRequest) returns (ProcessDetailReply);
  rpc ListHandles(ListHandlesRequest) returns (ListHandlesReply);
  rpc ListModules(ListModulesRequest) returns (ListModulesReply);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsReply);
  rpc FindResourceOwners(FindResourceOwnersRequest) returns (FindResourceOwnersReply);
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsReply);
  rpc ListListeningPorts(ListListeningPortsRequest) returns (ListListeningPortsReply);
  rpc ListScheduledTasks(ListScheduledTasksRequest) returns (ListScheduledTasksReply);
  rpc ListBoots(ListBootsRequest) returns (ListBootsReply);
  rpc GetBatteryStatus(GetBatteryStatusRequest) returns (GetBatteryStatusReply);
  rpc GetThermal(GetThermalRequest) returns (GetThermalReply);
  rpc ListPrivacyAlertRules(ListPrivacyAlertRulesRequest) returns (ListPrivacyAlertRulesReply);
  rpc CreatePrivacyAlertRule(CreatePrivacyAlertRuleRequest) returns (CreatePrivacyAlertRuleReply);
  rpc UpdatePrivacyAlertRule(UpdatePrivacyAlertRuleRequest) returns (UpdatePrivacyAlertRuleReply);
  rpc DeletePrivacyAlertRule(DeletePrivacyAlertRuleRequest) returns (DeletePrivacyAlertRuleReply);
  rpc ListFiredAlerts(ListFiredAlertsRequest) returns (ListFiredAlertsReply);
  rpc ListSystemChanges(ListSystemChangesRequest) returns (ListSystemChangesReply);
  rpc ListCrashes(ListCrashesRequest) returns (ListCrashesReply);
  rpc GenerateSupportBundle(SupportBundleRequest) returns (SupportBundleReply);
  rpc GetSecurityMetadata(GetSecurityMetadataRequest) returns (GetSecurityMetadataReply);
}

// ---------------------------------------------------------------------------
// R3: expert security metadata (PRD §9.4.1/§9.4.6). On-demand deep security
// detail for one process — the signing certificate chain, file hash, token
// privileges/groups/capabilities, and process mitigation policies. Read-only;
// cross-user/protected processes degrade honestly (limited / unavailable).
// ---------------------------------------------------------------------------

message CertInfo {
  string subject = 1;
  string issuer = 2;
  string thumbprint_sha1 = 3;
  int64 not_before_ms = 4;
  int64 not_after_ms = 5;
}

message TokenPrivilege {
  // e.g. "SeDebugPrivilege".
  string name = 1;
  bool enabled = 2;
}

message SecurityMetadata {
  // File identity.
  string file_sha256 = 1;
  // Reuses the inspector's signature label ("Signed (Microsoft)" / ...).
  string signature_status = 2;
  // Signing certificate chain, leaf → root (empty when unsigned/unavailable).
  repeated CertInfo cert_chain = 3;
  // Token.
  string user_sid = 4;
  string integrity_level = 5;
  bool elevated = 6;
  bool app_container = 7;
  repeated TokenPrivilege privileges = 8;
  // Group names (or SIDs where the name can't be resolved).
  repeated string groups = 9;
  // App-container capability names, when applicable.
  repeated string capabilities = 10;
  // Process mitigation policies that are on, e.g. "DEP", "ASLR (high-entropy)",
  // "CFG", "no child processes", where readable.
  repeated string mitigations = 11;
  // True when some fields were unavailable (cross-user without elevation).
  bool limited = 12;
}

message GetSecurityMetadataRequest {
  uint32 pid = 1;
  int64 create_time_100ns = 2;
}

message GetSecurityMetadataReply {
  bool available = 1;
  string unavailable_reason = 2;
  SecurityMetadata metadata = 3;
}

// ---------------------------------------------------------------------------
// R3: remote support bundle (PRD §9.18 diagnostic bundle, §18.3). One redacted,
// self-contained diagnostic document a user can hand to IT/support — assembled
// from data Atlas already has (health, incidents+diagnoses, changes, crashes,
// inventories, own overhead), passed through the shared Redactor. Read-only.
// Reuses the existing RedactionOptions (M8).
// ---------------------------------------------------------------------------

enum SupportBundleSection {
  SUPPORT_BUNDLE_SECTION_UNSPECIFIED = 0;
  BUNDLE_DEVICE_INFO = 1;
  BUNDLE_HEALTH = 2;
  BUNDLE_INCIDENTS = 3;
  BUNDLE_SYSTEM_CHANGES = 4;
  BUNDLE_CRASHES = 5;
  BUNDLE_SERVICES = 6;
  BUNDLE_STARTUP = 7;
  BUNDLE_SELF_METRICS = 8;
}

message SupportBundleRequest {
  // Window to summarize (incidents/changes/crashes). Default = last 72 h.
  TimeRange range = 1;
  RedactionOptions redaction = 2;
  // Sections to include; empty = all.
  repeated SupportBundleSection sections = 3;
  // Output format. HTML self-contained (default), JSON, or text.
  ReportFormat format = 4;
}

message SupportBundleReply {
  string content = 1;
  string content_type = 2;
  // Suggested file name, e.g. "atlas-support-2026-07-15.html".
  string filename = 3;
  // Echo of the redaction categories actually applied.
  repeated string redaction_applied = 4;
}

// ---------------------------------------------------------------------------
// R3: system-change tracking (PRD §9.13) — "what changed before the problem
// started?". The service diffs its own inventories (apps/services/startup/
// tasks) and reads WUA + driver/CBS event history; changes are recorded and
// queryable, read-only.
// ---------------------------------------------------------------------------

enum SystemChangeKind {
  SYSTEM_CHANGE_KIND_UNSPECIFIED = 0;
  APP_INSTALLED = 1;
  APP_UPDATED = 2;
  APP_REMOVED = 3;
  DRIVER_INSTALLED = 4;
  DRIVER_UPDATED = 5;
  WINDOWS_UPDATE = 6;
  SERVICE_INSTALLED = 7;
  SERVICE_CONFIG_CHANGED = 8;
  SERVICE_REMOVED = 9;
  STARTUP_ADDED = 10;
  STARTUP_REMOVED = 11;
  SCHEDULED_TASK_ADDED = 12;
  SCHEDULED_TASK_REMOVED = 13;
  POWER_PLAN_CHANGED = 14;
  DEFAULT_APP_CHANGED = 15;
}

message SystemChange {
  int64 id = 1;
  int64 ts_ms = 2;
  SystemChangeKind kind = 3;
  // The app / driver / service / entry the change is about.
  string subject = 4;
  // Human-readable before→after summary.
  string detail = 5;
  string publisher = 6;
  // Responsible installer/process where known; empty otherwise.
  string responsible = 7;
  // Whether Atlas knows a reversal path (informational this milestone).
  bool reversible = 8;
}

message ListSystemChangesRequest {
  TimeRange range = 1;
  // Empty = all kinds.
  repeated SystemChangeKind kinds = 2;
  uint32 limit = 3;
}

message ListSystemChangesReply {
  repeated SystemChange changes = 1;
  bool truncated = 2;
}

// ---------------------------------------------------------------------------
// R3: reliability / crash correlation (PRD §9.14). Unifies WER app crashes,
// hangs, bugchecks, and service failures with the resource/change context
// around each event, read-only.
// ---------------------------------------------------------------------------

enum CrashKind {
  CRASH_KIND_UNSPECIFIED = 0;
  APP_CRASH = 1;
  APP_HANG = 2;
  BUGCHECK = 3;
  SERVICE_FAILURE = 4;
  UNEXPECTED_SHUTDOWN = 5;
  GPU_DRIVER_RESET = 6;
}

message CrashRecord {
  int64 id = 1;
  int64 ts_ms = 2;
  CrashKind kind = 3;
  string subject = 4;
  // Faulting module / bugcheck code / exception where known.
  string fault = 5;
  string exception_code = 6;
  // Correlated context assembled by the service (peak memory, recent update,
  // repeated-restart note, etc.) — factual, confidence-tagged in the detail.
  repeated string context = 7;
}

message ListCrashesRequest {
  TimeRange range = 1;
  repeated CrashKind kinds = 2;
  uint32 limit = 3;
}

message ListCrashesReply {
  bool available = 1;
  // e.g. "reliability log unavailable".
  string unavailable_reason = 2;
  repeated CrashRecord crashes = 3;
  bool truncated = 4;
}

// ---------------------------------------------------------------------------
// R2: advanced privacy alerts (PRD §9.10.3). Alert rules over camera/mic/
// location usage; the service's ConsentStore change-watcher evaluates them and
// records fired alerts. Never implies malicious behavior — factual only.
// ---------------------------------------------------------------------------

enum PrivacyAlertCondition {
  PRIVACY_ALERT_CONDITION_UNSPECIFIED = 0;
  // Any use of the capability.
  ALERT_ANY_USE = 1;
  // Background (non-foreground) use.
  ALERT_BACKGROUND_USE = 2;
  // Use while the session is locked.
  ALERT_WHILE_LOCKED = 3;
  // Use by an app that is unknown / unsigned.
  ALERT_UNKNOWN_APP = 4;
  // Active longer than threshold_seconds.
  ALERT_LONGER_THAN = 5;
}

message PrivacyAlertRule {
  int64 id = 1;
  string name = 2;
  bool enabled = 3;
  // Capability to watch; UNSPECIFIED = all (camera + microphone + location).
  CapabilityKind capability = 4;
  PrivacyAlertCondition condition = 5;
  // Threshold for ALERT_LONGER_THAN.
  uint32 threshold_seconds = 6;
  int64 created_ms = 7;
}

message FiredAlert {
  int64 id = 1;
  int64 rule_id = 2;
  string rule_name = 3;
  int64 ts_ms = 4;
  CapabilityKind capability = 5;
  string app_id = 6;
  string display_name = 7;
  // Factual detail ("background use while locked"); never accusatory.
  string detail = 8;
}

message ListPrivacyAlertRulesRequest {}
message ListPrivacyAlertRulesReply { repeated PrivacyAlertRule rules = 1; }

message CreatePrivacyAlertRuleRequest { PrivacyAlertRule rule = 1; } // id ignored
message CreatePrivacyAlertRuleReply { int64 id = 1; }

message UpdatePrivacyAlertRuleRequest { PrivacyAlertRule rule = 1; }
message UpdatePrivacyAlertRuleReply { bool ok = 1; }

message DeletePrivacyAlertRuleRequest { int64 id = 1; }
message DeletePrivacyAlertRuleReply { bool ok = 1; }

message ListFiredAlertsRequest {
  TimeRange range = 1;
  uint32 limit = 2;
}

message ListFiredAlertsReply {
  repeated FiredAlert alerts = 1;
  bool truncated = 2;
}

// ---------------------------------------------------------------------------
// R2: monitors — network, scheduled tasks, boot analysis, battery, thermal.
// All read-only. Hardware-dependent replies (battery, thermal) carry
// available + unavailable_reason so absent sensors degrade honestly (§9.6.7).
// ---------------------------------------------------------------------------

enum L4Protocol {
  L4_PROTOCOL_UNSPECIFIED = 0;
  TCP = 1;
  UDP = 2;
}

enum TcpState {
  TCP_STATE_UNSPECIFIED = 0;
  TCP_CLOSED = 1;
  TCP_LISTEN = 2;
  TCP_SYN_SENT = 3;
  TCP_SYN_RCVD = 4;
  TCP_ESTABLISHED = 5;
  TCP_FIN_WAIT1 = 6;
  TCP_FIN_WAIT2 = 7;
  TCP_CLOSE_WAIT = 8;
  TCP_CLOSING = 9;
  TCP_LAST_ACK = 10;
  TCP_TIME_WAIT = 11;
  TCP_DELETE_TCB = 12;
}

message Connection {
  uint32 pid = 1;
  string image_name = 2;
  L4Protocol protocol = 3;
  string local_addr = 4;
  uint32 local_port = 5;
  string remote_addr = 6;
  uint32 remote_port = 7;
  // Resolved via the DNS cache where available; empty otherwise.
  string remote_domain = 8;
  // Only meaningful for TCP.
  TcpState state = 9;
  bool is_ipv6 = 10;
}

message ListConnectionsRequest {
  bool include_listening = 1;
}

message ListConnectionsReply {
  repeated Connection connections = 1;
}

message ListeningPort {
  L4Protocol protocol = 1;
  string bind_addr = 2;
  uint32 port = 3;
  uint32 pid = 4;
  string image_name = 5;
  bool is_ipv6 = 6;
}

message ListListeningPortsRequest {}

message ListListeningPortsReply {
  repeated ListeningPort ports = 1;
}

message ScheduledTask {
  string name = 1;
  // Full task path incl. folder, e.g. "\Microsoft\Windows\Foo".
  string path = 2;
  string folder = 3;
  bool enabled = 4;
  // Human-readable trigger summary.
  string triggers = 5;
  // Executable + arguments of the primary action.
  string action = 6;
  int64 last_run_ms = 7;
  int64 next_run_ms = 8;
  int32 last_result = 9;
  string author = 10;
  bool run_as_highest = 11;
  bool runs_on_idle = 12;
  bool wakes_to_run = 13;
}

message ListScheduledTasksRequest {
  // Case-insensitive substring over name/path; empty = all.
  string filter = 1;
}

message ListScheduledTasksReply {
  repeated ScheduledTask tasks = 1;
}

message BootRecord {
  // When the boot occurred.
  int64 boot_ms = 1;
  uint32 boot_duration_ms = 2;
  uint32 main_path_ms = 3;
  uint32 post_boot_ms = 4;
  // Flagged slower than the rolling baseline.
  bool degraded = 5;
}

message ListBootsRequest {
  uint32 limit = 1;
}

message ListBootsReply {
  bool available = 1;
  // e.g. "diagnostics-performance log unavailable".
  string unavailable_reason = 2;
  repeated BootRecord boots = 3;
}

message BatteryStatus {
  bool present = 1;
  bool charging = 2;
  bool on_ac = 3;
  uint32 percent = 4;
  // Charge/discharge rate in milliwatts; negative = discharging.
  int32 rate_mw = 5;
  uint64 remaining_mwh = 6;
  uint64 full_charge_mwh = 7;
  uint64 design_mwh = 8;
  // full_charge / design, where derivable.
  uint32 health_percent = 9;
  uint32 cycle_count = 10;
  int64 est_runtime_s = 11;
}

message GetBatteryStatusRequest {}

message GetBatteryStatusReply {
  bool available = 1;
  // "no battery present" on desktops.
  string unavailable_reason = 2;
  BatteryStatus status = 3;
}

message ThermalSensor {
  string name = 1;
  double celsius = 2;
  // Where the reading came from (ACPI thermal zone, OEM WMI, ...).
  string source = 3;
}

message GetThermalRequest {}

