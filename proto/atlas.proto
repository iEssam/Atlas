// System Atlas IPC contract (tech-stack.md §5).
// Contract sketch — compiled into the service and UI clients at milestone M4.
// Rules: additive-only changes within a major version; buf lint/breaking in CI.

syntax = "proto3";

package atlas.v0;

message CapabilitiesRequest {}

message CapabilitiesReply {
  string service_version = 1;
  // Degraded-mode propagation: UIs render only what the service can provide,
  // e.g. "gpu_vendor_telemetry", "driver_sensors", "etw_process_events".
  repeated string capability_flags = 2;
}

message ProcessRow {
  uint32 pid = 1;
  uint32 parent_pid = 2;
  string image_name = 3;
  uint32 session_id = 4;
  // FILETIME units (100 ns since 1601-01-01); part of process identity.
  int64 create_time_100ns = 5;
  // Share of total CPU capacity, 0..=1000.
  uint32 cpu_permille = 6;
  uint64 working_set = 7;
  uint64 private_bytes = 8;
  uint64 read_bps = 9;
  uint64 write_bps = 10;
  uint32 handle_count = 11;
  uint32 thread_count = 12;
}

message SystemGauges {
  int64 ts_ms = 1;
  uint32 cpu_permille = 2;
  uint64 mem_used = 3;
  uint64 mem_total = 4;
  uint64 commit_used = 5;
  uint64 commit_limit = 6;
  uint32 process_count = 7;
  uint32 thread_count = 8;
  uint32 handle_count = 9;
}

message SnapshotRequest {
  // 0 = all processes.
  uint32 top_n = 1;
}

message SnapshotReply {
  SystemGauges system = 1;
  repeated ProcessRow processes = 2;
}

service AtlasQuery {
  rpc GetCapabilities(CapabilitiesRequest) returns (CapabilitiesReply);
  rpc GetSnapshot(SnapshotRequest) returns (SnapshotReply);
  rpc StreamSnapshots(SnapshotRequest) returns (stream SnapshotReply);
}
