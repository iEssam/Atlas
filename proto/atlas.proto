  bool available = 1;
  // "no thermal sensors exposed" — honest when hardware doesn't provide them.
  string unavailable_reason = 2;
  repeated ThermalSensor sensors = 3;
}

// ---------------------------------------------------------------------------
// R2: deep process inspector + resource ownership (PRD §9.4, §9.5).
// All on-demand (unary), read-only. Cross-user handle/module inspection may be
// limited without elevation — replies carry explicit coverage flags rather
// than silently returning less (PRD §9.6.7 honesty principle).
// ---------------------------------------------------------------------------

message ProcessDetailRequest {
  uint32 pid = 1;
  // Identity guard against PID reuse; 0 = best-effort by pid.
  int64 create_time_100ns = 2;
}

message ProcessDetail {
  uint32 pid = 1;
  uint32 parent_pid = 2;
  int64 create_time_100ns = 3;
  string image_name = 4;
  string image_path = 5;
  string command_line = 6;
  string working_directory = 7;
  string user_sid = 8;
  string user_name = 9;
  uint32 session_id = 10;
  // "System" / "High" / "Medium" / "Low" / "AppContainer" / "" if unknown.
  string integrity_level = 11;
  bool elevated = 12;
  // "x64" / "x86" / "Arm64" / "".
  string architecture = 13;
  // "Signed (Microsoft)" / "Signed" / "Unsigned" / "Unknown".
  string signature_status = 14;
  string publisher = 15;
  string file_version = 16;
  string product_name = 17;
  uint32 thread_count = 18;
  uint32 handle_count = 19;
  int64 start_time_ms = 20;
  // MSIX/AppX package identity; empty for desktop apps.
  string package_identity = 21;
  // True when some fields were unavailable (e.g. cross-user without elevation).
  bool limited = 22;
}

message ProcessDetailReply {
  bool available = 1;
  // "process exited" / "access denied (elevation may help)".
  string unavailable_reason = 2;
  ProcessDetail detail = 3;
}

message ListHandlesRequest {
  uint32 pid = 1;
  // e.g. "File", "Key", "Event"; empty = all types.
  string type_filter = 2;
  uint32 limit = 3;
}

message HandleRow {
  uint64 handle = 1;
  string type = 2;
  // Resolved object name; empty when unresolved/unavailable.
  string name = 3;
  uint32 granted_access = 4;
}

message ListHandlesReply {
  repeated HandleRow handles = 1;
  bool truncated = 2;
  // Name resolution was restricted (needs elevation / handle not duplicable).
  bool names_limited = 3;
}

message ListModulesRequest {
  uint32 pid = 1;
}

message ModuleRow {
  string name = 1;
  string path = 2;
  uint64 base_address = 3;
  uint64 size = 4;
  string version = 5;
  string publisher = 6;
  bool signed = 7;
}

message ListModulesReply {
  bool available = 1;
  // "access denied (elevation may help)" for cross-user processes.
  string unavailable_reason = 2;
  repeated ModuleRow modules = 3;
}

message ListThreadsRequest {
  uint32 pid = 1;
}

message ThreadRow {
  uint32 tid = 1;
  uint64 start_address = 2;
  // "Running" / "Waiting" / "Ready" / "Terminated" / ...
  string state = 3;
  string wait_reason = 4;
  int32 priority = 5;
  // Recent CPU share if computable, else 0.
  uint32 cpu_permille = 6;
  int64 user_time_100ns = 7;
  int64 kernel_time_100ns = 8;
  uint32 context_switches = 9;
}

message ListThreadsReply {
  repeated ThreadRow threads = 1;
}

// PRD §9.5 — "find what is using this file". Restart Manager first; the request
// is a path this milestone (ports/registry/modules can extend it later).
message FindResourceOwnersRequest {
  string path = 1;
}

message ResourceOwner {
  uint32 pid = 1;
  string image_name = 2;
  string image_path = 3;
  // Restart Manager friendly description / app type.
  string description = 4;
  bool is_service = 5;
}

message FindResourceOwnersReply {
  bool available = 1;
  string unavailable_reason = 2;
  repeated ResourceOwner owners = 3;
}

// ---------------------------------------------------------------------------
// M6: safe process actions — broker v0 (PRD §9.22, tech-stack §4.5).
// Two-phase: Prepare returns the risk picture + a short-lived, single-use
// consent token; Execute performs exactly the prepared action. Every
// prepare/execute is audited server-side regardless of outcome.
// ---------------------------------------------------------------------------

enum ProcessActionKind {
  PROCESS_ACTION_UNSPECIFIED = 0;
  // Post WM_CLOSE to the process's top-level windows (close normally).
  CLOSE_WINDOWS = 1;
  SUSPEND = 2;
  RESUME = 3;
  TERMINATE = 4;
}

message PrepareActionRequest {
  uint32 pid = 1;
  // Guards against PID reuse between prepare and execute.
  int64 create_time_100ns = 2;
  ProcessActionKind action = 3;
}

message ActionRisk {
  // On the protected-critical list (never allowed).
  bool is_critical = 1;
  // Owned by SYSTEM / session 0.
  bool is_system = 2;
  uint32 visible_windows = 3;
  uint32 child_count = 4;
  // Human-readable caveats ("children will become orphans", ...).
  repeated string notes = 5;
}

message PrepareActionReply {
  bool allowed = 1;
  // Set when allowed=false.
  string denial_reason = 2;
  ActionRisk risk = 3;
  // Opaque, single-use; empty when allowed=false.
  string consent_token = 4;
  int64 token_expires_ms = 5;
}

message ExecuteActionRequest {
  string consent_token = 1;
}

message ExecuteActionReply {
  bool success = 1;
  string message = 2;
}

service AtlasControl {
  rpc PrepareAction(PrepareActionRequest) returns (PrepareActionReply);
  rpc ExecuteAction(ExecuteActionRequest) returns (ExecuteActionReply);
}

// ---------------------------------------------------------------------------
// R2: performance rules engine + profiles (PRD §9.7).
// Persistent, reversible policies applied to matching processes. Enabling a
// rule IS the consent (unlike the one-shot AtlasControl broker); every
// application is reversible and audited, and protected-critical processes are
// never touched. Actions are the safe, reversible subset: priority class,
// core affinity / P-E steering, and EcoQoS efficiency mode.
// ---------------------------------------------------------------------------

enum RuleTrigger {
  RULE_TRIGGER_UNSPECIFIED = 0;
  // Apply to matching processes whenever they run.
  WHILE_RUNNING = 1;
  // ...only while on AC power.
  ON_AC_POWER = 2;
  // ...only while on battery.
  ON_DC_POWER = 3;
  // ...only while a matching process is the foreground/fullscreen app.
  ON_FULLSCREEN = 4;
  // Matching process sustained the configured GPU load.
  ON_GPU_LOAD = 5;
  // The adapter used by the matching process reports hardware throttling.
  ON_GPU_THERMAL_THROTTLE = 6;
}

enum PriorityClass {
  // Leave priority unchanged.
  PRIORITY_CLASS_UNSPECIFIED = 0;
  PRIORITY_IDLE = 1;
  PRIORITY_BELOW_NORMAL = 2;
  PRIORITY_NORMAL = 3;
  PRIORITY_ABOVE_NORMAL = 4;
  PRIORITY_HIGH = 5;
  // No REALTIME — unsafe, deliberately unsupported.
}

enum CoreAffinityMode {
  // Leave affinity unchanged.
  CORE_AFFINITY_UNSPECIFIED = 0;
  ALL_CORES = 1;
  PREFER_P_CORES = 2;
  PREFER_E_CORES = 3;
  // Use affinity_mask verbatim.
  CUSTOM_MASK = 4;
}

message RuleAction {
  PriorityClass priority = 1;
  CoreAffinityMode affinity_mode = 2;
  // Processor affinity bitmask when affinity_mode = CUSTOM_MASK.
  uint64 affinity_mask = 3;
  // Enable EcoQoS (efficiency mode / ProcessPowerThrottling).
  bool eco_qos = 4;
}

message Rule {
  int64 id = 1;
  string name = 2;
  bool enabled = 3;
  // Case-insensitive image-name match (e.g. "chrome.exe"). Empty matches none.
  string match_image = 4;
  RuleTrigger trigger = 5;
  RuleAction action = 6;
  // Higher precedence wins when rules conflict on the same process.
  int32 precedence = 7;
  int64 created_ms = 8;
  // Used by ON_GPU_LOAD. UI defaults: 800 permille for 5 seconds.
  uint32 gpu_threshold_permille = 9;
  uint32 gpu_duration_seconds = 10;
}

message ListRulesRequest {}
message ListRulesReply { repeated Rule rules = 1; }

message GetRuleRequest { int64 id = 1; }
message GetRuleReply { bool found = 1; Rule rule = 2; }

message CreateRuleRequest { Rule rule = 1; } // id ignored
message CreateRuleReply { int64 id = 1; }

message UpdateRuleRequest { Rule rule = 1; }
message UpdateRuleReply { bool ok = 1; string message = 2; }

message DeleteRuleRequest { int64 id = 1; }
message DeleteRuleReply { bool ok = 1; }

message SetRuleEnabledRequest { int64 id = 1; bool enabled = 2; }
message SetRuleEnabledReply { bool ok = 1; }

// Dry-run preview (PRD §9.7.5) — never applies anything.
message SimulateRuleRequest { Rule rule = 1; } // an unsaved rule is allowed

message SimulatedTarget {
  uint32 pid = 1;
  string image_name = 2;
  string current_priority = 3;
  string new_priority = 4;
  string current_affinity = 5;
  string new_affinity = 6;
  bool eco_qos_change = 7;
  // Blocked because the target is protected-critical.
  bool blocked = 8;
  string blocked_reason = 9;
}

message SimulateRuleReply {
  repeated SimulatedTarget targets = 1;
  // Conflicts with other enabled rules (PRD §9.7.6).
  repeated string conflicts = 2;
}

message Intervention {
  int64 rule_id = 1;
  string rule_name = 2;
  uint32 pid = 3;
  string image_name = 4;
  // Human summary of what is currently applied.
  string applied = 5;
  int64 since_ms = 6;
}

message ListInterventionsRequest {}
message ListInterventionsReply { repeated Intervention interventions = 1; }

// Profiles (PRD §9.7.4): a named, activatable bundle of rules + a power mode.
message Profile {
  int64 id = 1;
  string name = 2;
  repeated int64 rule_ids = 3;
  // "" / "PowerSaver" / "Balanced" / "HighPerformance".
  string power_mode = 4;
  bool active = 5;
}

message ListProfilesRequest {}
message ListProfilesReply { repeated Profile profiles = 1; }

message CreateProfileRequest { Profile profile = 1; }
message CreateProfileReply { int64 id = 1; }

message UpdateProfileRequest { Profile profile = 1; }
message UpdateProfileReply { bool ok = 1; }

message DeleteProfileRequest { int64 id = 1; }
message DeleteProfileReply { bool ok = 1; }

message SetProfileActiveRequest { int64 id = 1; bool active = 2; }
message SetProfileActiveReply { bool ok = 1; string message = 2; }

service AtlasRules {
  rpc ListRules(ListRulesRequest) returns (ListRulesReply);
  rpc GetRule(GetRuleRequest) returns (GetRuleReply);
  rpc CreateRule(CreateRuleRequest) returns (CreateRuleReply);
  rpc UpdateRule(UpdateRuleRequest) returns (UpdateRuleReply);
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleReply);
  rpc SetRuleEnabled(SetRuleEnabledRequest) returns (SetRuleEnabledReply);
  rpc SimulateRule(SimulateRuleRequest) returns (SimulateRuleReply);
  rpc ListInterventions(ListInterventionsRequest) returns (ListInterventionsReply);
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesReply);
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileReply);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileReply);
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileReply);
  rpc SetProfileActive(SetProfileActiveRequest) returns (SetProfileActiveReply);
  rpc GetDynamicProtection(GetDynamicProtectionRequest) returns (GetDynamicProtectionReply);
  rpc SetDynamicProtection(SetDynamicProtectionRequest) returns (SetDynamicProtectionReply);
}

// ---------------------------------------------------------------------------
// R3: dynamic responsiveness protection (PRD §9.7.3). A watchdog that, when
// explicitly enabled, TEMPORARILY dampens a background process monopolizing
// the CPU and auto-restores it — never touches protected-critical or the
// foreground app, keeps a record of every intervention, off by default.
// Dampening interventions surface through the existing ListInterventions with
// rule_id = 0 and rule_name "Dynamic responsiveness protection".
// ---------------------------------------------------------------------------

message DynamicProtectionConfig {
  // Off by default — early versions act only on explicit user approval.
  bool enabled = 1;
  // A process must exceed this system-CPU share to be a candidate (permille).
  uint32 cpu_threshold_permille = 2;
  // ...sustained for at least this long before any intervention.
  uint32 sustain_seconds = 3;
  // Auto-restore cap: never dampen a process longer than this.
  uint32 max_intervention_seconds = 4;
}

message GetDynamicProtectionRequest {}
message GetDynamicProtectionReply { DynamicProtectionConfig config = 1; }

message SetDynamicProtectionRequest { DynamicProtectionConfig config = 1; }
message SetDynamicProtectionReply {
  bool ok = 1;
  string message = 2;
}

// ---------------------------------------------------------------------------
// R3: signed plugin framework (PRD §18.3, tech-stack §4.6). Out-of-process,
// Authenticode-signed, capability-scoped READ-ONLY extensions.
//
// Security model: the service verifies a plugin executable's Authenticode
// signature before it can be enabled (unsigned is refused unless the user
// explicitly overrides), records the signing publisher, and the user grants a
// subset of read-only capabilities. An enabled plugin is launched with a
// one-time launch nonce; it calls OpenPluginSession to exchange that nonce for
// a session token scoped to its granted capabilities. A server interceptor
// enforces that a request carrying a plugin token may only reach the granted
// AtlasQuery read RPCs — never AtlasControl / AtlasRules / AtlasPlugins
// management (plugins are read-only, full stop). First-party UI/CLI requests
// carry no plugin token and keep full read access. Off by default; every
// register / grant / enable / session-open / rejected-call is audited.
// ---------------------------------------------------------------------------

enum PluginSignature {
  PLUGIN_SIGNATURE_UNSPECIFIED = 0;
  // Authenticode signature valid (embedded or catalog).
  PLUGIN_SIGNED = 1;
  // No valid signature — refused unless the user explicitly overrides.
  PLUGIN_UNSIGNED = 2;
  // Verification could not complete.
  PLUGIN_SIG_UNKNOWN = 3;
}

// A read-only slice of the AtlasQuery surface a plugin may be granted. Grouped
// by concern so grants stay comprehensible; the interceptor maps each RPC to
// its group.
enum PluginCapability {
  PLUGIN_CAPABILITY_UNSPECIFIED = 0;
  PLUGIN_CAP_SNAPSHOT = 1;    // GetSnapshot / StreamSnapshots
  PLUGIN_CAP_HISTORY = 2;     // QueryRange / ListEvents / ListBookmarks
  PLUGIN_CAP_SEARCH = 3;      // Search
  PLUGIN_CAP_INCIDENTS = 4;   // ListIncidents / Diagnose
  PLUGIN_CAP_INVENTORY = 5;   // ListServices / ListStartup / ListScheduledTasks
  PLUGIN_CAP_NETWORK = 6;     // ListConnections / ListListeningPorts
  PLUGIN_CAP_FORENSICS = 7;   // ListSystemChanges / ListCrashes
}

message Plugin {
  int64 id = 1;
  string name = 2;
  string version = 3;
  // From the signing certificate subject when signed; empty otherwise.
  string publisher = 4;
  string exe_path = 5;
  PluginSignature signature = 6;
  bool enabled = 7;
  repeated PluginCapability granted = 8;
  int64 registered_ms = 9;
  string description = 10;
}

message ListPluginsRequest {}
message ListPluginsReply { repeated Plugin plugins = 1; }

message RegisterPluginRequest {
  string exe_path = 1;
  // Capabilities to grant initially (the user edits later).
  repeated PluginCapability requested = 2;
  // Explicit, unsafe opt-in to register an unsigned plugin. Default false →
  // an unsigned executable is refused.
  bool allow_unsigned = 3;
}

message RegisterPluginReply {
  bool ok = 1;
  // e.g. "refused: executable is not signed".
  string message = 2;
  Plugin plugin = 3;
}

message SetPluginEnabledRequest {
  int64 id = 1;
  bool enabled = 2;
}
message SetPluginEnabledReply {
  bool ok = 1;
  string message = 2;
}

message GrantPluginCapabilitiesRequest {
  int64 id = 1;
  repeated PluginCapability granted = 2;
}
message GrantPluginCapabilitiesReply {
  bool ok = 1;
}

message RemovePluginRequest {
  int64 id = 1;
}
message RemovePluginReply {
  bool ok = 1;
}

message OpenPluginSessionRequest {
  int64 plugin_id = 1;
  // The one-time nonce the service handed the launched plugin process; proves
  // it is the registered, enabled, signature-verified plugin.
  string launch_nonce = 2;
}

message OpenPluginSessionReply {
  bool ok = 1;
  string message = 2;
  // Presented in gRPC metadata ("atlas-plugin-token") on AtlasQuery calls; the
  // interceptor rejects any call outside the granted capabilities.
  string session_token = 3;
  repeated PluginCapability granted = 4;
}

service AtlasPlugins {
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsReply);
  rpc RegisterPlugin(RegisterPluginRequest) returns (RegisterPluginReply);
  rpc SetPluginEnabled(SetPluginEnabledRequest) returns (SetPluginEnabledReply);
  rpc GrantPluginCapabilities(GrantPluginCapabilitiesRequest) returns (GrantPluginCapabilitiesReply);
  rpc RemovePlugin(RemovePluginRequest) returns (RemovePluginReply);
  rpc OpenPluginSession(OpenPluginSessionRequest) returns (OpenPluginSessionReply);
}
