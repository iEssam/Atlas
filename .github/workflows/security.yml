name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-supply-chain:
    name: Rust advisories, licenses, and sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  nuget-audit:
    name: NuGet transitive audit and lock verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src-ui/Atlas.sln -p:Platform=x64 --locked-mode

  dependency-review:
    name: Pull request dependency review (GitHub Code Security)
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.ENABLE_GITHUB_CODE_SECURITY == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
