name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate documentation links
        shell: pwsh
        run: ./scripts/validate-docs.ps1

      - name: Restore .NET solution
        run: dotnet restore src-ui/Atlas.sln -p:Platform=x64 --locked-mode

      - name: Build Explorer command and sparse identity package
        shell: pwsh
        run: ./shell-ext/build.ps1 -Configuration Release -Platform x64

      - name: Build WinUI app
        run: dotnet build src-ui/Atlas.App/Atlas.App.csproj -c Debug -p:Platform=x64 --no-restore

      - name: Smoke-test WinUI shell and navigation
        shell: pwsh
        run: ./scripts/ui-smoke.ps1 -StartPage graphics -ExpectedElementName Graphics

      - name: Smoke-test Explorer file activation
        shell: pwsh
        run: |
          $selectedFile = Join-Path $env:RUNNER_TEMP 'atlas smoke file.txt'
          New-Item -ItemType File -Force -Path $selectedFile | Out-Null
          ./scripts/ui-smoke.ps1 -ExpectedElementName 'File Lock Search' -FindUsingPath $selectedFile

      - name: Test IPC client
        run: dotnet test src-ui/Atlas.IpcClient.Tests/Atlas.IpcClient.Tests.csproj -c Debug --no-restore

      - name: Test UI contracts
        run: dotnet test src-ui/Atlas.App.Tests/Atlas.App.Tests.csproj -c Debug --no-restore

  # M9 adds perf gates here (idle CPU, RSS, cold start, disk writes/hour)
  # on a self-hosted runner — see tech-stack.md §10.
