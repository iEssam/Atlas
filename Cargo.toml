[workspace]
resolver = "2"
members = [
    "crates/atlas-collectors",
    "crates/atlas-store",
    "crates/atlas-tsdb",
    "crates/atlas-ipc",
    "crates/atlas-service",
    "crates/atlas-mcp",
    "crates/atlas-cli",
    "crates/atlas-plugin-example",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
publish = false
authors = ["Essam Alghamedi <hello@iessam.com>"]
license = "Apache-2.0"
repository = "https://github.com/iEssam/System-Atlas"
homepage = "https://github.com/iEssam/System-Atlas"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
ctrlc = "3"
ferrisetw = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# IPC (M4): gRPC over Windows named pipes. tonic 0.13 has the stable
# serve_with_incoming + Connected transport surface this crate wires against.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "signal"] }
tonic = "0.13"
prost = "0.13"
tower = "0.5"
tokio-stream = "0.1"
tonic-build = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
hyper-util = { version = "0.1", features = ["tokio"] }

[profile.release]
lto = "thin"
strip = "symbols"
